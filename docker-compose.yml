services:
  postgres:
    image: postgres:16-alpine
    container_name: daily-task-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: daily_task_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - daily_task_tracker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d daily_task_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  daily_task_tracker_pgdata:
