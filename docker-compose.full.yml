services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: daily_task_tracker, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    ports: ["5432:5432"]
    volumes: ["daily_task_tracker_pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d daily_task_tracker"], interval: 5s, timeout: 5s, retries: 10 }
  api:
    build:
      context: .
      dockerfile: backend/DailyTaskTracker.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=daily_task_tracker;Username=postgres;Password=postgres
    ports: ["5080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
  frontend:
    build: ./frontend/daily-task-tracker
    ports: ["4200:80"]
    depends_on: [api]
volumes:
  daily_task_tracker_pgdata:
